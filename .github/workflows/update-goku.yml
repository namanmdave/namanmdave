name: Update Git Goku

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-goku:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Git Goku GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python git_goku.py --username ${{ github.repository_owner }} --output goku.gif

      - name: Commit & push updated Goku
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add goku.gif
          git diff --staged --quiet || (git commit -m "🔥 chore: update profile saiyan streak [skip ci]" && git push)
