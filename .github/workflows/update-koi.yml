name: Update Git Koi

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-koi:
    runs-on: ubuntu-latest
    steps:
      # Official GitHub Action - zero third-party/untrusted dependencies
      - name: Checkout repository
        uses: actions/checkout@v4

      # Official Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pillow

      - name: Generate Git Koi GIF
        run: |
          python git_koi.py --username ${{ github.repository_owner }} --output koi.gif

      - name: Commit & push updated Koi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koi.gif
          git diff --staged --quiet || (git commit -m "🎨 chore: update profile git koi [skip ci]" && git push)
